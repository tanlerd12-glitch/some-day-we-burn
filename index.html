<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Some day we burn — Chan Suk</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#ece7e0;
    --dim:#9a948c;
    --faint:#615c55;
    --ember:#ff7322;
    --ember-soft:#ffae5e;
    --line:rgba(236,231,224,0.12);
    --glass:rgba(18,16,15,0.62);
    --bg:#070605;
    --serif:'Schibsted Grotesk',system-ui,sans-serif;
    --mono:'Space Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--serif);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #root{height:100%;}
  ::selection{background:rgba(255,115,34,0.3);color:#fff;}

  /* ---------- room ---------- */
  .room{position:fixed;inset:0;overflow:hidden;}
  .backdrop{
    position:absolute;inset:-12%;
    background-size:cover;background-position:center;
    filter:blur(90px) saturate(1.25) brightness(0.52);
    transform:scale(1.25);
    opacity:0.65;
  }
  .room-grade{
    position:absolute;inset:0;
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(70,80,96,0.18), transparent 55%),
      radial-gradient(120% 70% at 50% 116%, rgba(255,86,24,0.16), transparent 60%),
      radial-gradient(80% 60% at 50% 50%, transparent 30%, rgba(0,0,0,0.55) 100%),
      linear-gradient(180deg, rgba(4,4,4,0.55), rgba(4,4,4,0.2) 40%, rgba(4,4,4,0.78));
  }
  .fire-wash{
    position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(90% 55% at 48% 108%, rgba(255,96,20,0.22), transparent 60%);
    mix-blend-mode:screen;
    animation:wash 5.5s ease-in-out infinite;
  }
  @keyframes wash{0%,100%{opacity:.55}50%{opacity:1}}

  /* ---------- stage ---------- */
  .stage-wrap{
    position:fixed;inset:0;
    display:flex;align-items:center;justify-content:center;
    z-index:2;
  }
  .stage{
    position:relative;
    height:min(94vh,128vw);
    aspect-ratio:1300/1733;
    box-shadow:0 40px 120px -30px rgba(0,0,0,0.9), 0 0 0 1px rgba(236,231,224,0.06);
    transition:filter .6s ease;
  }
  .stage::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    box-shadow:inset 0 0 120px 10px rgba(0,0,0,0.5);
    z-index:6;
  }
  .painting{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;display:block;
    z-index:1;
  }

  /* face spotlight */
  .face-light{
    position:absolute;left:48%;top:49%;
    width:46%;aspect-ratio:1;transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,238,214,0.5), rgba(255,224,190,0.12) 45%, transparent 70%);
    mix-blend-mode:soft-light;
    opacity:0;
    z-index:3;pointer-events:none;
  }
  .stage.awake .face-light{opacity:1;transform:translate(-50%,-50%) scale(1.04);}

  /* glow blobs */
  .glow{position:absolute;border-radius:50%;mix-blend-mode:screen;pointer-events:none;transform:translate(-50%,-50%);z-index:2;}
  .glow.skull{
    left:13.5%;top:40%;width:20%;aspect-ratio:0.8;
    background:radial-gradient(circle, rgba(255,176,72,0.9), rgba(255,108,24,0.32) 45%, transparent 70%);
    animation:flick 2.3s ease-in-out infinite;
  }
  .glow.crownflame{
    left:58%;top:31%;width:9%;aspect-ratio:0.7;
    background:radial-gradient(circle, rgba(255,186,96,0.85), rgba(255,120,30,0.25) 50%, transparent 72%);
    animation:flick 1.7s ease-in-out infinite reverse;
  }
  .glow.fire{
    left:42%;top:92%;width:62%;aspect-ratio:1.5;
    background:radial-gradient(circle, rgba(255,150,46,0.7), rgba(255,86,16,0.34) 42%, transparent 66%);
    animation:flick 3s ease-in-out infinite;
  }
  .glow.heart{
    left:85%;top:45%;width:18%;aspect-ratio:1;
    background:radial-gradient(circle, rgba(255,70,86,0.55), rgba(214,40,60,0.22) 48%, transparent 72%);
    animation:breathe 4.4s ease-in-out infinite;
  }
  .glow.butterfly{
    left:41%;top:31%;width:15%;aspect-ratio:1;
    background:radial-gradient(circle, rgba(255,196,120,0.34), rgba(120,150,210,0.14) 50%, transparent 72%);
    animation:breathe 5.2s ease-in-out infinite;
  }
  @keyframes flick{
    0%{opacity:.55;transform:translate(-50%,-50%) scale(0.96)}
    25%{opacity:.95;transform:translate(-50%,-51%) scale(1.04)}
    50%{opacity:.7;transform:translate(-50%,-50%) scale(1)}
    75%{opacity:1;transform:translate(-51%,-50.5%) scale(1.06)}
    100%{opacity:.6;transform:translate(-50%,-50%) scale(0.97)}
  }
  @keyframes breathe{0%,100%{opacity:.5;transform:translate(-50%,-50%) scale(0.98)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}}

  /* particles */
  .particles{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden;}
  .ember{position:absolute;width:4px;height:4px;border-radius:50%;
    background:radial-gradient(circle,#ffd9a0,#ff7a1e 60%,transparent);
    filter:blur(.3px);opacity:0;animation:rise linear infinite;}
  @keyframes rise{
    0%{opacity:0;transform:translateY(0) translateX(0) scale(1)}
    12%{opacity:1}
    70%{opacity:.9}
    100%{opacity:0;transform:translateY(-150px) translateX(var(--drift,12px)) scale(0.4)}
  }
  .smoke{position:absolute;border-radius:50%;
    background:radial-gradient(circle, rgba(180,176,170,0.16), transparent 68%);
    mix-blend-mode:screen;filter:blur(6px);opacity:0;
    animation:smokeDrift linear infinite;}
  @keyframes smokeDrift{
    0%{opacity:0;transform:translate(0,0) scale(0.8)}
    25%{opacity:.7}
    100%{opacity:0;transform:translate(var(--sx,40px),-90px) scale(1.5)}
  }

  /* hotspots */
  .hotspot{
    position:absolute;transform:translate(-50%,-50%);z-index:7;
    width:46px;height:46px;border:0;background:transparent;cursor:pointer;
    display:grid;place-items:center;
  }
  .hs-dot{
    width:13px;height:13px;border-radius:50%;
    background:rgba(255,247,238,0.92);
    box-shadow:0 0 0 1px rgba(0,0,0,0.4),0 0 16px 3px rgba(255,180,110,0.6);
    transition:transform .25s ease;position:relative;z-index:2;
  }
  .hs-ring{
    position:absolute;width:13px;height:13px;border-radius:50%;
    border:1px solid rgba(255,247,238,0.8);
    animation:ringPulse 2.6s ease-out infinite;
  }
  .hs-ring.b{animation-delay:1.3s;}
  @keyframes ringPulse{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(3.4)}}
  .hotspot:hover .hs-dot,.hotspot:focus-visible .hs-dot{transform:scale(1.5);}
  .hotspot.seen .hs-dot{background:var(--ember-soft);box-shadow:0 0 0 1px rgba(0,0,0,0.4),0 0 18px 4px rgba(255,140,60,0.7);}
  .hotspot.active .hs-dot{transform:scale(1.7);background:#fff;}
  .hs-label{
    position:absolute;top:calc(50% + 16px);left:50%;transform:translateX(-50%);
    font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink);white-space:nowrap;opacity:0;transition:opacity .2s ease;
    background:var(--glass);padding:3px 8px;border-radius:100px;backdrop-filter:blur(8px);
    border:1px solid var(--line);pointer-events:none;
  }
  .hotspot:hover .hs-label,.hotspot.active .hs-label{opacity:1;}

  /* ---------- chrome ---------- */
  .chrome{position:fixed;inset:0;z-index:10;pointer-events:none;}
  .chrome > *{pointer-events:auto;}
  .corner{position:fixed;padding:clamp(16px,3vw,34px);}
  .tl{top:0;left:0;}
  .tr{top:0;right:0;text-align:right;}
  .bl{bottom:0;left:0;}
  .br{bottom:0;right:0;text-align:right;}

  .mark{font-family:var(--mono);font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--ink);}
  .mark small{display:block;color:var(--faint);letter-spacing:.28em;margin-top:5px;font-size:9.5px;}

  .title-block{max-width:min(46vw,440px);}
  .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--ember-soft);}
  .title{font-size:clamp(30px,5.4vw,68px);font-weight:600;line-height:0.96;letter-spacing:-0.02em;margin-top:14px;text-shadow:0 2px 30px rgba(0,0,0,0.7);}
  .title em{font-style:italic;font-weight:400;}
  .spec{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.04em;margin-top:18px;line-height:1.9;}
  .spec b{color:var(--ink);font-weight:400;}

  .hint{
    position:fixed;left:50%;bottom:clamp(18px,3vh,30px);transform:translateX(-50%);
    font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
    display:flex;align-items:center;gap:10px;transition:opacity .5s ease;white-space:nowrap;
    background:var(--glass);padding:8px 16px;border-radius:100px;border:1px solid var(--line);backdrop-filter:blur(10px);
  }
  .hint .pulse{width:6px;height:6px;border-radius:50%;background:var(--ember);box-shadow:0 0 10px var(--ember);animation:wash 1.8s infinite;}
  .hint.hidden{opacity:0;pointer-events:none;}

  /* index rail */
  .rail{display:flex;flex-direction:column;gap:13px;align-items:flex-end;}
  .rail .rail-head{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);margin-bottom:3px;}
  .rail-item{display:flex;align-items:center;gap:11px;justify-content:flex-end;background:transparent;border:0;cursor:pointer;color:var(--faint);font-family:var(--serif);}
  .rail-item .rl-name{font-size:13px;letter-spacing:.01em;}
  .rail-item .rl-tick{width:7px;height:7px;border-radius:50%;border:1px solid currentColor;transition:all .25s ease;}
  .rail-item.seen{color:var(--ink);}
  .rail-item.seen .rl-tick{background:var(--ember-soft);border-color:var(--ember-soft);box-shadow:0 0 10px rgba(255,140,60,0.6);}
  .rail-item.active{color:#fff;}

  .inquire-btn{
    pointer-events:auto;font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:#0b0a09;background:var(--ink);border:0;border-radius:100px;padding:13px 24px;cursor:pointer;
    transition:transform .2s ease, background .2s ease;margin-top:14px;
  }
  .inquire-btn:hover{transform:translateY(-2px);background:#fff;}
  .price-note{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-top:14px;}

  /* symbol panel */
  .panel{
    position:fixed;z-index:20;left:clamp(16px,3vw,34px);bottom:clamp(16px,3vw,34px);
    width:min(360px,86vw);background:var(--glass);backdrop-filter:blur(18px);
    border:1px solid var(--line);border-radius:18px;padding:24px 24px 22px;
    box-shadow:0 30px 80px -20px rgba(0,0,0,0.8);
  }
  .panel .p-idx{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--ember-soft);}
  .panel .p-title{font-size:25px;font-weight:600;letter-spacing:-0.01em;margin-top:10px;line-height:1.05;}
  .panel .p-body{font-size:14.5px;line-height:1.62;color:var(--dim);margin-top:12px;text-wrap:pretty;}
  .panel .p-close{position:absolute;top:16px;right:16px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--dim);cursor:pointer;font-size:14px;line-height:1;display:grid;place-items:center;}
  .panel .p-close:hover{color:var(--ink);border-color:var(--ink);}
  .panel .p-nav{display:flex;gap:8px;margin-top:20px;}
  .panel .p-nav button{flex:1;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:9px;border-radius:100px;border:1px solid var(--line);background:transparent;color:var(--dim);cursor:pointer;transition:all .2s;}
  .panel .p-nav button:hover{color:var(--ink);border-color:var(--ink);}

  /* modal */
  .modal-scrim{position:fixed;inset:0;z-index:40;background:rgba(3,3,3,0.7);backdrop-filter:blur(6px);display:grid;place-items:center;padding:24px;}
  .modal{width:min(460px,94vw);background:#0d0b0a;border:1px solid var(--line);border-radius:20px;padding:34px;box-shadow:0 40px 120px -30px #000;}
  .modal h3{font-size:26px;font-weight:600;letter-spacing:-0.01em;}
  .modal .m-sub{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--dim);margin-top:8px;line-height:1.7;}
  .field{margin-top:16px;}
  .field label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-bottom:7px;}
  .field input,.field textarea{width:100%;background:#161311;border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--ink);font-family:var(--serif);font-size:14px;resize:none;}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--ember-soft);}
  .m-actions{display:flex;gap:10px;margin-top:24px;align-items:center;}
  .m-send{flex:1;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;background:var(--ink);color:#0b0a09;border:0;border-radius:100px;padding:14px;cursor:pointer;transition:background .2s,transform .2s;}
  .m-send:hover{background:#fff;transform:translateY(-1px);}
  .m-cancel{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;background:transparent;border:0;color:var(--dim);cursor:pointer;padding:14px;}
  .m-cancel:hover{color:var(--ink);}
  .m-success{text-align:center;padding:14px 0 4px;}
  .m-success .tick{width:50px;height:50px;border-radius:50%;border:1px solid var(--ember-soft);color:var(--ember-soft);display:grid;place-items:center;margin:0 auto 18px;font-size:22px;}

  /* intro */
  .intro{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center;}
  .intro.gone{animation:introOut 1.1s ease forwards;pointer-events:none;}
  @keyframes introOut{0%{opacity:1}100%{opacity:0;visibility:hidden}}
  .intro .i-mark{font-family:var(--mono);font-size:12px;letter-spacing:.4em;text-transform:uppercase;color:var(--ember-soft);text-align:center;}
  .intro .i-mark span{display:block;color:var(--faint);font-size:9.5px;letter-spacing:.3em;margin-top:14px;animation:wash 2s infinite;}

  @media (max-width:760px){
    .title-block{max-width:64vw;}
    .tr .rail{display:none;}
    .spec{display:none;}
    .br{padding-bottom:74px;}
    .bl{display:none;}
    .panel{left:50%;transform:translateX(-50%);width:calc(100vw - 24px);bottom:12px;}
    .hint{bottom:auto;top:calc(50% - 0px);display:none;}
    .mobile-rail{display:flex !important;}
  }
  .mobile-rail{display:none;position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:12;gap:8px;background:var(--glass);padding:8px;border-radius:100px;border:1px solid var(--line);backdrop-filter:blur(10px);}
  .mobile-rail button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--faint);font-family:var(--mono);font-size:11px;cursor:pointer;display:grid;place-items:center;}
  .mobile-rail button.seen{color:var(--ember-soft);border-color:rgba(255,140,60,0.5);}
  .mobile-rail button.active{color:#fff;background:rgba(255,255,255,0.08);}

  @media (prefers-reduced-motion: reduce){
    .glow,.ember,.smoke,.fire-wash,.hs-ring{animation:none !important;}
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="react">

const { useState, useEffect, useRef, useCallback } = React;
const IMG = "assets/some-day-we-burn.jpg";

const SYMBOLS = [
  { id:"crown", n:"01", name:"Crown & Monarch", x:41, y:31,
    title:"The Crown of Thorns",
    body:"She wears suffering like a crown — mental captivity drawn in bare, thorned branches. Yet a monarch rests there, the oldest emblem of transformation. Captivity and the promise of change, balanced on the same brow." },
  { id:"skull", n:"02", name:"The Burning Skull", x:13.5, y:46,
    title:"The Burning Skull",
    body:"Mortality, lit and consuming itself. The flame is the mind on fire — urgent, racing thoughts that burn faster than they can be answered." },
  { id:"heart", n:"03", name:"Heart & Daisies", x:85, y:45,
    title:"The Heart in Bloom",
    body:"An anatomical heart, ringed like a small planet, with daisies pushing out of the wound. Pure, stubborn life — blooming in spite of everything, orbiting its own quiet gravity." },
  { id:"fire", n:"04", name:"Fire & Smoke", x:42, y:88,
    title:"Fire & Smoke",
    body:"The pressure rises in front of her and refuses to clear. It is overwhelm made visible — and the slow, necessary burning-away of the old self." },
];

function makeEmbers(n, baseX, baseY, spread, sizeMin){
  return Array.from({length:n}).map((_,i)=>({
    id:i,
    left: baseX + (Math.random()-0.5)*spread,
    top: baseY + (Math.random()-0.5)*spread*0.5,
    size: sizeMin + Math.random()*3,
    dur: 4 + Math.random()*4,
    delay: Math.random()*6,
    drift: (Math.random()-0.5)*40 + "px",
  }));
}
const SKULL_EMBERS = makeEmbers(7, 13.5, 42, 8, 2);
const FIRE_EMBERS = makeEmbers(14, 42, 90, 40, 2);
const SMOKES = Array.from({length:6}).map((_,i)=>({
  id:i,
  left: 55 + Math.random()*38,
  top: 74 + Math.random()*22,
  w: 16 + Math.random()*16,
  dur: 9 + Math.random()*7,
  delay: Math.random()*9,
  sx: (Math.random()*50+10) + "px",
}));

function Particles(){
  return (
    <div className="particles">
      {SKULL_EMBERS.concat(FIRE_EMBERS).map((e,i)=>(
        <div key={i} className="ember" style={{
          left:e.left+"%", top:e.top+"%", width:e.size, height:e.size,
          animationDuration:e.dur+"s", animationDelay:e.delay+"s", "--drift":e.drift,
        }}/>
      ))}
      {SMOKES.map(s=>(
        <div key={s.id} className="smoke" style={{
          left:s.left+"%", top:s.top+"%", width:s.w+"%", aspectRatio:"1",
          animationDuration:s.dur+"s", animationDelay:s.delay+"s", "--sx":s.sx,
        }}/>
      ))}
    </div>
  );
}

function Hotspot({s, seen, active, onOpen}){
  return (
    <button className={"hotspot"+(seen?" seen":"")+(active?" active":"")}
      style={{left:s.x+"%", top:s.y+"%"}}
      onMouseEnter={()=>onOpen(s.id,false)}
      onClick={()=>onOpen(s.id,true)}
      aria-label={s.name}>
      <span className="hs-ring"></span>
      <span className="hs-ring b"></span>
      <span className="hs-dot"></span>
      <span className="hs-label">{s.name}</span>
    </button>
  );
}

function App(){
  const [intro,setIntro] = useState(true);
  const [active,setActive] = useState(null);
  const [pinned,setPinned] = useState(false);
  const [seen,setSeen] = useState({});
  const [awake,setAwake] = useState(false);
  const [modal,setModal] = useState(false);
  const [sent,setSent] = useState(false);
  const [form,setForm] = useState({name:"",email:"",message:""});

  const INQUIRE_EMAIL = "tanlerd12@gmail.com";
  const sendInquiry = ()=>{
    const subject = "Inquiry: Some day we burn";
    const lines = [
      form.message || "I'd love to know more about this piece.",
      "",
      "— " + (form.name || ""),
      form.email || "",
      "",
      "Re: Some day we burn · Chan Suk · Oil on canvas · Original, 2024",
    ];
    const href = "mailto:" + INQUIRE_EMAIL +
      "?subject=" + encodeURIComponent(subject) +
      "&body=" + encodeURIComponent(lines.join("\n"));
    window.location.href = href;
    setSent(true);
  };

  const [introMounted,setIntroMounted] = useState(true);
  useEffect(()=>{
    const t1=setTimeout(()=>setIntro(false), 2100);
    const t2=setTimeout(()=>setIntroMounted(false), 3400);
    return ()=>{clearTimeout(t1);clearTimeout(t2);};
  },[]);

  const open = useCallback((id, click)=>{
    setActive(id);
    setSeen(s=> s[id]?s:{...s,[id]:true});
    if(click) setPinned(true);
  },[]);

  const close = ()=>{ setActive(null); setPinned(false); };

  const onStageLeave = ()=>{
    setAwake(false);
    if(!pinned){ setActive(null); }
  };

  const cur = SYMBOLS.find(s=>s.id===active);
  const seenCount = Object.keys(seen).length;

  const step = (dir)=>{
    const i = SYMBOLS.findIndex(s=>s.id===active);
    const next = SYMBOLS[(i+dir+SYMBOLS.length)%SYMBOLS.length];
    open(next.id, true);
  };

  useEffect(()=>{
    const onKey = e=>{ if(e.key==="Escape"){ close(); setModal(false);} };
    window.addEventListener("keydown",onKey);
    return ()=>window.removeEventListener("keydown",onKey);
  },[]);

  return (
    <React.Fragment>
      {/* room */}
      <div className="room">
        <div className="backdrop" style={{backgroundImage:`url(${IMG})`}}></div>
        <div className="room-grade"></div>
        <div className="fire-wash"></div>
      </div>

      {/* stage */}
      <div className="stage-wrap">
        <div className={"stage"+(awake?" awake":"")}
          onMouseEnter={()=>setAwake(true)}
          onMouseMove={()=>!awake&&setAwake(true)}
          onMouseLeave={onStageLeave}>
          <img className="painting" src={IMG} alt="Some day we burn — oil on canvas by Chan Suk"/>
          <div className="face-light"></div>
          <div className="glow butterfly"></div>
          <div className="glow crownflame"></div>
          <div className="glow skull"></div>
          <div className="glow heart"></div>
          <div className="glow fire"></div>
          <Particles/>
          {SYMBOLS.map(s=>(
            <Hotspot key={s.id} s={s} seen={!!seen[s.id]} active={active===s.id} onOpen={open}/>
          ))}
        </div>
      </div>

      {/* chrome */}
      <div className="chrome">
        <div className="corner tl">
          <div className="mark">CHAN&nbsp;SUK<small>STUDIO — SOLO WORKS</small></div>
        </div>

        <div className="corner tr">
          <div className="rail">
            <div className="rail-head">Living Symbols · {seenCount}/4</div>
            {SYMBOLS.map(s=>(
              <button key={s.id}
                className={"rail-item"+(seen[s.id]?" seen":"")+(active===s.id?" active":"")}
                onMouseEnter={()=>open(s.id,false)} onClick={()=>open(s.id,true)}>
                <span className="rl-name">{s.name}</span>
                <span className="rl-tick"></span>
              </button>
            ))}
          </div>
        </div>

        <div className="corner bl title-block">
          <div className="eyebrow">ORIGINAL · 2024 <span style={{color:'var(--faint)'}}>(Created in 2024)</span></div>
          <h1 className="title"><em>Some day</em><br/>we burn</h1>
          <div className="spec">
            <b>Chan Suk</b><br/>
            Oil on canvas · Original painting<br/>
            Single unique work — not editioned
          </div>
        </div>

        <div className="corner br">
          <div className="price-note">Price on request</div>
          <button className="inquire-btn" onClick={()=>{setModal(true);setSent(false);}}>Inquire for Price</button>
        </div>

        {!(awake||seenCount>0) && (
          <div className="hint">
            <span className="pulse"></span>Move across the canvas — four symbols are alive
          </div>
        )}
      </div>

      {/* mobile symbol rail */}
      <div className="mobile-rail">
        {SYMBOLS.map(s=>(
          <button key={s.id} className={(seen[s.id]?"seen":"")+(active===s.id?" active":"")}
            onClick={()=>open(s.id,true)}>{s.n}</button>
        ))}
      </div>

      {/* symbol panel */}
      {cur && (
      <div className="panel">
          <React.Fragment>
            <button className="p-close" onClick={close}>✕</button>
            <div className="p-idx">SYMBOL {cur.n} / 04</div>
            <div className="p-title">{cur.title}</div>
            <div className="p-body">{cur.body}</div>
            <div className="p-nav">
              <button onClick={()=>step(-1)}>← Prev</button>
              <button onClick={()=>step(1)}>Next →</button>
            </div>
          </React.Fragment>
      </div>
      )}

      {/* inquire modal */}
      {modal && (
      <div className="modal-scrim" onClick={e=>{if(e.target===e.currentTarget)setModal(false);}}>
        <div className="modal">
          {!sent ? (
            <React.Fragment>
              <h3>Inquire — <em>Some day we burn</em></h3>
              <div className="m-sub">Chan Suk · Oil on canvas · Original, 2024 <span style={{color:'var(--faint)'}}>(Created in 2024)</span><br/>Price on request. Tell us a little about you.</div>
              <div className="field"><label>Name</label><input type="text" placeholder="Your name" value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))}/></div>
              <div className="field"><label>Email</label><input type="email" placeholder="you@email.com" value={form.email} onChange={e=>setForm(f=>({...f,email:e.target.value}))}/></div>
              <div className="field"><label>Message</label><textarea rows="3" placeholder="I'd love to know more about this piece…" value={form.message} onChange={e=>setForm(f=>({...f,message:e.target.value}))}></textarea></div>
              <div className="m-actions">
                <button className="m-send" onClick={sendInquiry}>Send inquiry</button>
                <button className="m-cancel" onClick={()=>setModal(false)}>Cancel</button>
              </div>
            </React.Fragment>
          ) : (
            <div className="m-success">
              <div className="tick">✓</div>
              <h3>Inquiry sent</h3>
              <div className="m-sub" style={{marginTop:10}}>Your email draft to <em>{INQUIRE_EMAIL}</em> is open. The studio will reply about <em>Some day we burn</em> shortly.</div>
              <div className="m-actions" style={{justifyContent:"center"}}>
                <button className="m-cancel" onClick={()=>setModal(false)}>Close</button>
              </div>
            </div>
          )}
        </div>
      </div>
      )}

      {/* intro */}
      {introMounted && (
        <div className={"intro"+(intro?"":" gone")}>
          <div className="i-mark">CHAN&nbsp;SUK · 2024<span>Some day we burn</span></div>
        </div>
      )}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
